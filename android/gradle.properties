# Memory allocation: Optimized for 16GB RAM system
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Parallel builds: Utilizes multi-core CPU (i5 8-threads) to build independent tasks concurrently
org.gradle.parallel=true

# Caching: Speeds up subsequent builds by reusing outputs from previous builds (highly effective with SSD)
org.gradle.caching=true

# Configure on demand: Only configures projects that are useful for the specific build task
org.gradle.configureondemand=true

# Keep Gradle Daemon ready in background for near-instant builds
org.gradle.daemon=false

# Watch File System: Faster file change detection
org.gradle.vfs.watch=true

# Optimization strategy for Kotlin
kotlin.compiler.execution.strategy=in-process

# Modern Android development defaults
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true

# R8: Enables advanced code shrinking, obfuscation, and optimization for production performance
android.enableR8=true
android.nonTransitiveRClass=true
